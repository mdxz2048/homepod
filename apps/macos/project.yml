name: HomePodFlow
options:
  bundleIdPrefix: com.homepodflow
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  HomePodFlow:
    type: application
    platform: macOS
    sources:
      - path: HomePodFlow
      - path: ../../adapters/calibration/assets
        buildPhase: resources
        excludes:
          - "*.md"
    info:
      path: HomePodFlow-Info.plist
      properties:
        LSUIElement: true
        FlowUpdateFeedURL: https://homepodflow.mddxz.top/updates/latest.json
        FlowUpdatePublicKey: GorKT46sQRsn+x5jtYBc7iFJXUtLI1y1lVYDbTKY5DY=
        CFBundleDisplayName: HomePod Flow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: 使用麦克风聆听音箱测试音，测量并校准每台音箱的延迟。录音仅在本机临时分析，测试结束后删除。
        NSAudioCaptureUsageDescription: 将 Mac 播放的声音发送到你选择的音箱。
        NSLocalNetworkUsageDescription: 查找并连接同一网络中的 HomePod 音箱。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homepodflow.mac
        PRODUCT_NAME: HomePod Flow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: HomePodFlow.entitlements
        CURRENT_PROJECT_VERSION: 33
        MARKETING_VERSION: 0.4.0
    scheme:
      testTargets: []
