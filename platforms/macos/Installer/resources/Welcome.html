<h1>安装 HomePod Flow</h1>
<p>这个安装包会把 <b>HomePod Flow App</b> 和 <b>HomePod Flow Audio 虚拟声卡</b> 一起安装到本机。</p>
<p>App 内已包含冻结的 Python 音频服务、runtime 项目、核心库和延迟 helper，不需要另外安装 Python 或配置路径。</p>
<p>安装程序需要管理员权限，并会做两件事：</p>
<ul>
  <li>完整替换旧 App、虚拟声卡和运行环境；</li>
  <li>安装并验证成功后清理旧组件，提示重新启动 Mac。</li>
</ul>
<p class="note">升级时会先停止播放并恢复 Mac 默认输出，保留音箱布局和偏好设置。</p>
<p class="note">安装完成后请重新启动 Mac，使新版虚拟声卡驱动生效。</p>
</body>
</html>
